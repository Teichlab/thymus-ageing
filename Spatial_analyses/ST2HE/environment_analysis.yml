# Conda environment for the ST2HE integration / niche analysis notebooks (04a-05a, 00_*)
# and demo/demo_integration.py. Exported from the environment used for the manuscript
# (`conda env export --no-builds`; Ubuntu 22.04, x86_64, Python 3.12).
#
#   conda env create -f environment_analysis.yml
#   conda activate st2he-analysis
#
# The RAPIDS packages (*-cu12, rapids-singlecell, cupy) need an NVIDIA GPU with CUDA 12 and
# are only used by the notebooks (rsc.pp.pca / rsc.pp.bbknn / rsc.tl.leiden). The demo runs on
# CPU and only needs the CPU subset: scanpy, anndata, bbknn, scikit-learn, igraph, leidenalg.
# The image-processing scripts use a separate environment: scripts/requirements.txt.
